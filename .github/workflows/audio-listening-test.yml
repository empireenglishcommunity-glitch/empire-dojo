name: audio listening test

# Renders the 20 fixed test sentences THREE ways — Kokoro (native), the owner's
# voice via F5-TTS, and via Chatterbox — uploads them plus an A/B/C compare page
# to R2, and prints one link. The owner listens and picks the engine before any
# mass render. Each engine is continue-on-error: one failing must not deny the
# owner the ones that worked.
on:
  workflow_dispatch:
    inputs:
      voice_bucket:
        default: "empire-voice"
      audio_bucket:
        default: "empire-audio"
      public_base:
        description: "Public base URL for the audio bucket"
        default: "https://audio.empireenglish.online"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      VOICE_BUCKET: ${{ inputs.voice_bucket }}
      AUDIO_BUCKET: ${{ inputs.audio_bucket }}
      PUBLIC_BASE: ${{ inputs.public_base }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System audio tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Fetch + normalise the reference voice
        run: |
          pip install --quiet boto3
          python3 - <<'PY'
          import os, boto3
          from botocore.config import Config
          def e(n): return os.environ[n].strip()
          s3 = boto3.client("s3",
              endpoint_url=f"https://{e('R2_ACCOUNT_ID')}.r2.cloudflarestorage.com",
              aws_access_key_id=e("R2_ACCESS_KEY_ID"),
              aws_secret_access_key=e("R2_SECRET_ACCESS_KEY"),
              region_name="auto", config=Config(signature_version="s3v4"))
          s3.download_file(e("VOICE_BUCKET"), "reference.m4a", "reference.m4a")
          print("downloaded reference.m4a")
          PY
          # 24 kHz mono WAV — the format the cloning models expect.
          ffmpeg -y -i reference.m4a -ac 1 -ar 24000 reference.wav
          echo "reference.wav ready:"; ls -la reference.wav

      - name: Render — Kokoro (native voice)
        continue-on-error: true
        run: |
          pip install --quiet kokoro-onnx soundfile
          cd scripts/tts
          curl -sL -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sL -o voices-v1.0.bin  https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          cd "$GITHUB_WORKSPACE"
          python3 scripts/tts/render_kokoro.py clips_raw

      - name: Render — your voice (F5-TTS)
        continue-on-error: true
        run: |
          pip install --quiet f5-tts
          python3 scripts/tts/render_f5.py reference.wav clips_raw

      - name: Render — your voice (Chatterbox)
        continue-on-error: true
        run: |
          pip install --quiet chatterbox-tts
          python3 scripts/tts/render_chatterbox.py reference.wav clips_raw

      - name: Encode to MP3 (48 kbps mono — speech grade)
        run: |
          mkdir -p clips
          shopt -s nullglob
          n=0
          for w in clips_raw/*.wav; do
            base=$(basename "$w" .wav)
            ffmpeg -y -loglevel error -i "$w" -ac 1 -ar 24000 -b:a 48k "clips/${base}.mp3"
            n=$((n+1))
          done
          echo "encoded $n clips"
          ls -la clips | head -20
          if [ "$n" = "0" ]; then
            echo "::error::No clips were rendered by ANY engine — see the render logs above."
            exit 1
          fi

      - name: Build the compare page
        run: |
          python3 scripts/build_compare_page.py clips /tmp/index.html "$PUBLIC_BASE/_listening-test/${{ github.run_id }}"
          cp /tmp/index.html clips/index.html

      - name: Upload to R2 + print the link
        run: |
          python3 - <<'PY'
          import os, mimetypes, boto3
          from pathlib import Path
          from botocore.config import Config
          def e(n): return os.environ[n].strip()
          s3 = boto3.client("s3",
              endpoint_url=f"https://{e('R2_ACCOUNT_ID')}.r2.cloudflarestorage.com",
              aws_access_key_id=e("R2_ACCESS_KEY_ID"),
              aws_secret_access_key=e("R2_SECRET_ACCESS_KEY"),
              region_name="auto", config=Config(signature_version="s3v4"))
          bucket = e("AUDIO_BUCKET")
          run_id = os.environ["GITHUB_RUN_ID"]
          prefix = f"_listening-test/{run_id}"
          got = {"kokoro": 0, "f5": 0, "chatterbox": 0}
          for p in sorted(Path("clips").iterdir()):
              key = f"{prefix}/{p.name}"
              ct = mimetypes.guess_type(p.name)[0] or "application/octet-stream"
              s3.put_object(Bucket=bucket, Key=key, Body=p.read_bytes(),
                            ContentType=ct, CacheControl="no-store")
              for eng in got:
                  if p.name.endswith(f".{eng}.mp3"):
                      got[eng] += 1
          base = e("PUBLIC_BASE")
          print("\n" + "=" * 60)
          print("  LISTENING TEST READY")
          print("=" * 60)
          print(f"  clips per engine: {got}")
          print(f"\n  >>> {base}/{prefix}/index.html\n")
          print("=" * 60)
          # surface it in the run summary too
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"## 🎧 Listening test ready\n\n")
              f.write(f"**[{base}/{prefix}/index.html]({base}/{prefix}/index.html)**\n\n")
              f.write(f"Clips rendered per engine: `{got}`\n")
          PY
