name: audio listening test

# Renders the 20 fixed test sentences THREE ways — Kokoro (native), the owner's
# voice via F5-TTS, and via Chatterbox — then assembles an A/B/C compare page on
# R2 and prints one link.
#
# The engines run as PARALLEL jobs, each with its own timeout, so a slow engine
# (F5 diffusion on CPU is very slow) can never block the others. Whatever
# renders in time is what the owner hears; the assemble job builds the page from
# exactly the clips that made it to R2. This is also the shard pattern the mass
# render will use.
on:
  workflow_dispatch:
    inputs:
      voice_bucket:
        default: "empire-voice"
      audio_bucket:
        default: "empire-audio"
      public_base:
        default: "https://audio.empireenglish.online"
      # Which engines to run. Defaults to Kokoro ALONE, because that comparison
      # is already settled: Kokoro rendered 20/20 on CPU, F5-TTS did not finish
      # 20 sentences in 45 minutes (~60 h for the site, over the 6 h job cap),
      # and Chatterbox crashed outright on Python 3.12. Voice cloning is
      # deferred until a GPU is available, not abandoned — so the harness stays,
      # but a default run must not report a red tick for a conclusion we already
      # acted on. Pass "kokoro f5 chatterbox" to re-run the full comparison.
      engines:
        description: "Space-separated engines: kokoro, f5, chatterbox"
        default: "kokoro"

env:
  AUDIO_BUCKET: ${{ inputs.audio_bucket }}
  VOICE_BUCKET: ${{ inputs.voice_bucket }}
  PUBLIC_BASE: ${{ inputs.public_base }}
  PREFIX: _listening-test/${{ github.run_id }}

jobs:
  # Turns the engines string into a JSON array for the matrix below. Same
  # pattern as audio-render.yml — a matrix cannot split a string itself.
  plan:
    runs-on: ubuntu-latest
    outputs:
      engines: ${{ steps.split.outputs.engines }}
    steps:
      - id: split
        env:
          ENGINES: ${{ inputs.engines }}
        run: |
          json=$(python3 -c "import json,os; print(json.dumps(os.environ['ENGINES'].split()))")
          echo "engines=$json" >> "$GITHUB_OUTPUT"
          echo "engines: $json"

  render:
    needs: plan
    strategy:
      fail-fast: false          # one engine failing must not cancel the others
      matrix:
        engine: ${{ fromJson(needs.plan.outputs.engines) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install --quiet boto3

      - name: Fetch + normalise the reference voice
        if: matrix.engine != 'kokoro'
        run: |
          python3 - <<'PY'
          import os, boto3
          from botocore.config import Config
          def e(n): return os.environ[n].strip()
          s3 = boto3.client("s3",
              endpoint_url=f"https://{e('R2_ACCOUNT_ID')}.r2.cloudflarestorage.com",
              aws_access_key_id=e("R2_ACCESS_KEY_ID"),
              aws_secret_access_key=e("R2_SECRET_ACCESS_KEY"),
              region_name="auto", config=Config(signature_version="s3v4"))
          s3.download_file(e("VOICE_BUCKET"), "reference.m4a", "reference.m4a")
          print("downloaded reference.m4a")
          PY
          ffmpeg -y -loglevel error -i reference.m4a -ss 0.5 -t 12 -ac 1 -ar 24000 reference_clone.wav
          ls -la reference_clone.wav

      - name: Render (${{ matrix.engine }})
        run: |
          set -x
          case "${{ matrix.engine }}" in
            kokoro)
              pip install --quiet kokoro-onnx soundfile
              cd scripts/tts
              curl -sL -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
              curl -sL -o voices-v1.0.bin  https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
              cd "$GITHUB_WORKSPACE"
              python3 scripts/tts/render_kokoro.py clips_raw
              ;;
            f5)
              pip install --quiet f5-tts faster-whisper
              python3 scripts/tts/render_f5.py reference_clone.wav clips_raw
              ;;
            chatterbox)
              pip install --quiet chatterbox-tts
              python3 scripts/tts/render_chatterbox.py reference_clone.wav clips_raw
              ;;
          esac

      - name: Encode + upload this engine's clips
        if: always()          # upload whatever rendered, even if some sentences failed
        run: |
          mkdir -p clips
          shopt -s nullglob
          n=0
          for w in clips_raw/*.wav; do
            base=$(basename "$w" .wav)
            ffmpeg -y -loglevel error -i "$w" -ac 1 -ar 24000 -b:a 48k "clips/${base}.mp3" && n=$((n+1))
          done
          echo "encoded $n clips for ${{ matrix.engine }}"
          [ "$n" = "0" ] && { echo "nothing to upload"; exit 0; }
          python3 - <<'PY'
          import os, mimetypes, boto3
          from pathlib import Path
          from botocore.config import Config
          def e(n): return os.environ[n].strip()
          s3 = boto3.client("s3",
              endpoint_url=f"https://{e('R2_ACCOUNT_ID')}.r2.cloudflarestorage.com",
              aws_access_key_id=e("R2_ACCESS_KEY_ID"),
              aws_secret_access_key=e("R2_SECRET_ACCESS_KEY"),
              region_name="auto", config=Config(signature_version="s3v4"))
          bucket, prefix = e("AUDIO_BUCKET"), os.environ["PREFIX"]
          for p in sorted(Path("clips").glob("*.mp3")):
              s3.put_object(Bucket=bucket, Key=f"{prefix}/{p.name}",
                            Body=p.read_bytes(), ContentType="audio/mpeg",
                            CacheControl="no-store")
              print("uploaded", p.name)
          PY

  assemble:
    needs: render
    if: always()              # build the page from whatever the engines produced
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet boto3

      - name: Download rendered clips, build compare page, upload + link
        run: |
          python3 - <<'PY'
          import os, boto3
          from pathlib import Path
          from botocore.config import Config
          def e(n): return os.environ[n].strip()
          s3 = boto3.client("s3",
              endpoint_url=f"https://{e('R2_ACCOUNT_ID')}.r2.cloudflarestorage.com",
              aws_access_key_id=e("R2_ACCESS_KEY_ID"),
              aws_secret_access_key=e("R2_SECRET_ACCESS_KEY"),
              region_name="auto", config=Config(signature_version="s3v4"))
          bucket, prefix = e("AUDIO_BUCKET"), os.environ["PREFIX"]
          Path("clips").mkdir(exist_ok=True)
          got = {"kokoro": 0, "f5": 0, "chatterbox": 0}
          r = s3.list_objects_v2(Bucket=bucket, Prefix=prefix + "/")
          for o in r.get("Contents", []):
              k = o["Key"]
              if k.endswith(".mp3"):
                  name = k.split("/")[-1]
                  s3.download_file(bucket, k, f"clips/{name}")
                  for eng in got:
                      if name.endswith(f".{eng}.mp3"):
                          got[eng] += 1
          print("clips present per engine:", got)
          Path("_got.txt").write_text(str(got))
          PY
          python3 scripts/build_compare_page.py clips /tmp/index.html "$PUBLIC_BASE/$PREFIX"
          python3 - <<'PY'
          import os, boto3
          from botocore.config import Config
          def e(n): return os.environ[n].strip()
          s3 = boto3.client("s3",
              endpoint_url=f"https://{e('R2_ACCOUNT_ID')}.r2.cloudflarestorage.com",
              aws_access_key_id=e("R2_ACCESS_KEY_ID"),
              aws_secret_access_key=e("R2_SECRET_ACCESS_KEY"),
              region_name="auto", config=Config(signature_version="s3v4"))
          bucket, prefix = e("AUDIO_BUCKET"), os.environ["PREFIX"]
          s3.put_object(Bucket=bucket, Key=f"{prefix}/index.html",
                        Body=open("/tmp/index.html","rb").read(),
                        ContentType="text/html; charset=utf-8", CacheControl="no-store")
          link = f"{e('PUBLIC_BASE')}/{prefix}/index.html"
          got = open("_got.txt").read()
          print("\n" + "="*60)
          print("  LISTENING TEST READY")
          print("  clips per engine:", got)
          print(f"  >>> {link}")
          print("="*60)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"## 🎧 Listening test ready\n\n**[{link}]({link})**\n\nClips per engine: `{got}`\n")
          PY
