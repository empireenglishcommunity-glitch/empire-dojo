name: audio r2 smoke test

# Proves the audio pipeline's foundations BEFORE we build 12 hours of rendering
# on top of them:
#   1. the R2 S3 credentials work,
#   2. the private voice bucket actually holds the owner's reference file,
#   3. an object written to the public bucket is reachable over the custom
#      domain (i.e. delivery works end to end).
#
# Manual only. Costs nothing, writes one throwaway object and deletes it.
on:
  workflow_dispatch:
    inputs:
      public_bucket:
        description: "Public audio bucket"
        default: "empire-audio"
      voice_bucket:
        description: "Private voice bucket (holds reference.m4a)"
        default: "empire-voice"
      public_domain:
        description: "Public domain connected to the audio bucket"
        default: "audio.empireenglish.online"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Fail early if R2 secrets are missing
        env:
          A: ${{ secrets.R2_ACCOUNT_ID }}
          K: ${{ secrets.R2_ACCESS_KEY_ID }}
          S: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          miss=0
          [ -z "$A" ] && { echo "::error::R2_ACCOUNT_ID secret is not set"; miss=1; }
          [ -z "$K" ] && { echo "::error::R2_ACCESS_KEY_ID secret is not set"; miss=1; }
          [ -z "$S" ] && { echo "::error::R2_SECRET_ACCESS_KEY secret is not set"; miss=1; }
          [ "$miss" = "1" ] && exit 1
          echo "All three R2 secrets are present."

      - name: Install boto3
        run: pip install --quiet boto3

      - name: R2 checks
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PUBLIC_BUCKET: ${{ inputs.public_bucket }}
          VOICE_BUCKET: ${{ inputs.voice_bucket }}
          PUBLIC_DOMAIN: ${{ inputs.public_domain }}
        run: |
          python3 - <<'PY'
          import os, sys, time, urllib.request, boto3
          from botocore.config import Config

          # Strip whitespace from every secret. A trailing newline pasted into a
          # GitHub secret ends up INSIDE the AWS SigV4 credential string
          # ("Credential=KEY\n/date/...") and the request is rejected with
          # "Invalid header value" — which is exactly what run #1 hit. Stripping
          # here makes the pipeline robust to how the secrets were pasted,
          # instead of depending on a clean copy every time.
          def env(name):
              v = os.environ.get(name, "")
              stripped = v.strip()
              if v != stripped:
                  print(f"  note: {name} had surrounding whitespace — stripped "
                        f"({len(v)} -> {len(stripped)} chars)")
              return stripped

          acct = env("R2_ACCOUNT_ID")
          s3 = boto3.client(
              "s3",
              endpoint_url=f"https://{acct}.r2.cloudflarestorage.com",
              aws_access_key_id=env("R2_ACCESS_KEY_ID"),
              aws_secret_access_key=env("R2_SECRET_ACCESS_KEY"),
              region_name="auto",
              config=Config(signature_version="s3v4"),
          )
          pub = os.environ["PUBLIC_BUCKET"]
          voice = os.environ["VOICE_BUCKET"]
          domain = os.environ["PUBLIC_DOMAIN"]
          fail = []

          def list_keys(bucket):
              """List object keys in a bucket. A scoped R2 token CAN list objects
              in a bucket it owns (unlike ListBuckets, which needs account-wide
              scope — that was the wrong thing to test in run #2)."""
              out = []
              try:
                  r = s3.list_objects_v2(Bucket=bucket, MaxKeys=50)
                  for o in r.get("Contents", []):
                      out.append((o["Key"], o["Size"]))
              except Exception as e:
                  return None, e
              return out, None

          print("=== 1. private voice bucket contents ===")
          keys, err = list_keys(voice)
          if err is not None:
              fail.append(f"cannot access bucket {voice}: {err}")
              print("  ERROR:", err)
          elif not keys:
              fail.append(f"bucket {voice} is EMPTY — reference.m4a was not uploaded")
              print(f"  {voice} is empty")
          else:
              for k, sz in keys:
                  print(f"  {k}  ({sz/1024:.0f} KB)")
              has_ref = any(k == "reference.m4a" for k, _ in keys)
              audio = [(k, sz) for k, sz in keys
                       if k.lower().endswith((".m4a", ".mp3", ".wav", ".mp4", ".ogg"))]
              if has_ref:
                  print("  OK: reference.m4a is present")
              elif audio:
                  fail.append(f"an audio file exists in {voice} but it is not named "
                              f"'reference.m4a' (found: {audio[0][0]}). Either rename "
                              f"it or tell me the name to use.")
              else:
                  fail.append(f"{voice} has objects but no audio file")

          print("\n=== 2. write to public bucket + read over the custom domain ===")
          key = f"_smoke/ping-{int(time.time())}.txt"
          token = f"empire-audio-ok-{int(time.time())}"
          try:
              s3.put_object(Bucket=pub, Key=key, Body=token.encode(),
                            ContentType="text/plain", CacheControl="no-store")
              print(f"  wrote {pub}/{key}")
              url = f"https://{domain}/{key}"
              got = None
              for attempt in range(6):
                  time.sleep(3)
                  try:
                      with urllib.request.urlopen(url, timeout=15) as r:
                          got = r.read().decode().strip()
                          print(f"  attempt {attempt+1}: HTTP {r.status} -> {got!r}")
                          break
                  except Exception as e:
                      print(f"  attempt {attempt+1}: {e}")
              if got == token:
                  print(f"  OK: public delivery works — {url}")
              else:
                  fail.append(
                      f"wrote to {pub} fine, but reading over https://{domain}/ "
                      f"returned 403/none. The custom domain routes to R2 but "
                      f"PUBLIC ACCESS is not enabled. In the R2 dashboard open the "
                      f"{pub} bucket -> Settings -> Public access -> connect/enable "
                      f"the custom domain {domain}.")
          except Exception as e:
              fail.append(f"public write/read failed: {e}")
              print("  ERROR:", e)
          finally:
              try:
                  s3.delete_object(Bucket=pub, Key=key)
                  print(f"  cleaned up {key}")
              except Exception:
                  pass

          print("\n" + "=" * 50)
          if fail:
              print("SMOKE TEST FAILED:")
              for f in fail:
                  print("  -", f)
              sys.exit(1)
          print("SMOKE TEST PASSED — R2 read/write and public delivery all work.")
          PY
