name: empire-dojo verify

# Run on PRs that touch site content, the generator, or this workflow —
# and on pushes to main, so the deployed branch is continuously verified.
on:
  pull_request:
    paths:
      - "scripts/**"
      - "site/**"
      - "functions/**"
      - ".github/workflows/dojo-verify.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "site/**"
      - "functions/**"
      - ".github/workflows/dojo-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout empire-dojo
        uses: actions/checkout@v4

      - name: Checkout empire-nexus (curriculum source)
        uses: actions/checkout@v4
        with:
          repository: empireenglishcommunity-glitch/empire-nexus
          path: empire-nexus

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        # soundfile is needed by verify_audio_pace.py to read MP3 durations.
        run: pip install --quiet soundfile

      # ---------------------------------------------------------------
      #  0. Edge Functions must parse.
      #
      #  functions/_middleware.js is the gate in front of EVERY page on the
      #  site. A syntax error there does not degrade gracefully: Cloudflare
      #  fails the Function, and the one thing this file is responsible for
      #  — not serving paid content to strangers — stops happening. Until
      #  now this directory was not even in the workflow's path filter, so
      #  the single highest-consequence file in the repo was the only one
      #  with no automated check at all. `node --check` is preinstalled on
      #  the runner and costs nothing.
      # ---------------------------------------------------------------
      - name: Edge Functions must parse (node --check)
        run: |
          shopt -s nullglob
          found=0
          for f in functions/*.js functions/**/*.js; do
            echo "checking $f"
            node --check "$f"
            found=1
          done
          if [ "$found" = "0" ]; then
            echo "::error::No files matched functions/**/*.js — the check silently passed on nothing."
            exit 1
          fi

      # ---------------------------------------------------------------
      #  1. The committed site/ must match what the generator produces.
      #
      #  This step exists because of a real gap found by the 2026-08-29
      #  audit: this workflow used to regenerate site/ and then verify the
      #  REGENERATED output, which means a divergence between the committed
      #  pages and the generator could never fail the build. Since site/ is
      #  what actually gets deployed, that was the one thing most worth
      #  checking. Verified byte-identical at the time this gate was added,
      #  so it starts green rather than being merged already-failing.
      # ---------------------------------------------------------------
      - name: Regenerate site from curriculum
        id: regen
        if: ${{ !cancelled() }}
        run: |
          EEC_REPO_DIR=${{ github.workspace }}/empire-nexus python3 scripts/generate.py

      # Every check below runs even if an earlier check FAILED, because a
      # failing step used to hide every check after it. That is not
      # hypothetical: the American-voices change (#149) left site/ drifted
      # from the generator AND shipped a C1 clip at 152 wpm against a 195
      # target. The drift step failed first, the pace step never ran, and
      # main stayed red for a single reported reason while a second real
      # defect sat behind it undetected. One run must now report ALL of
      # them. `!cancelled()` keeps the steps honest without hiding
      # anything the way continue-on-error would: each step still fails
      # the job, it just no longer suppresses its successors.
      #
      # These checks all read the regenerated site/, so they are only
      # meaningful if the generator itself ran — hence the regen guard.
      - name: Committed site/ must match the generator (no drift)
        if: ${{ !cancelled() && steps.regen.outcome == 'success' }}
        run: |
          if ! git diff --quiet -- site/ scripts/audio-manifest.json; then
            echo "::error::The committed site/ does not match what generate.py produces."
            echo "Regenerate locally and commit the result:"
            echo "  EEC_REPO_DIR=<path-to-empire-nexus> python3 scripts/generate.py"
            echo ""
            echo "Files that differ:"
            git --no-pager diff --stat -- site/ scripts/audio-manifest.json
            exit 1
          fi
          echo "Committed site/ is identical to the generator output."

      # ---------------------------------------------------------------
      #  2. Structural / injection sweep over every generated page.
      # ---------------------------------------------------------------
      - name: Verify all generated pages (html.parser + injection sweep)
        if: ${{ !cancelled() && steps.regen.outcome == 'success' }}
        run: python3 scripts/verify_pages.py

      # ---------------------------------------------------------------
      #  3. Delivery pace. NOT cosmetic: several CEFR descriptors are
      #     claims about speed ("speak slowly and clearly" at A1 through
      #     "fast native speed" at C2), and this is the only check that
      #     tests that claim against the actual rendered artefact. Pace
      #     has already been a real shipped defect once, when clips were
      #     rendered per-voice without normalising for the fact that the
      #     Kokoro voices differ by 1.84x at the same speed setting.
      # ---------------------------------------------------------------
      - name: Verify extended-listening delivery pace
        if: ${{ !cancelled() && steps.regen.outcome == 'success' }}
        run: python3 scripts/verify_audio_pace.py

      # ---------------------------------------------------------------
      #  4. Authentic-audio manifest. Guards the two film reservations
      #     (B2.R.2, C1.R.2): a scene may only be declared authentic if
      #     its file exists, is a plausible size, and is not byte-identical
      #     to the TTS clip it claims to replace.
      #
      #     NOTE: this check catches MECHANICAL failures only. Listing a
      #     scene in the manifest is a human trust declaration that the
      #     audio is a real recording, and no script can verify that.
      #     Never describe a green tick here as proof of authenticity.
      # ---------------------------------------------------------------
      - name: Verify authentic-audio declarations
        if: ${{ !cancelled() && steps.regen.outcome == 'success' }}
        run: |
          EEC_REPO_DIR=${{ github.workspace }}/empire-nexus \
            python3 scripts/verify_authentic_audio.py
